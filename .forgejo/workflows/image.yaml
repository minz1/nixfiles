on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: nixos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: https://github.com/DeterminateSystems/nix-installer-action@v22

      - uses: https://github.com/nix-community/cache-nix-action/restore@v7
        id: cache-nix
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Build image
        run: nix build .#incus-bootstrap-image -o result

      - name: Publish image
        run: |
          set -a; source /run/secrets/tofu-env; set +a
          export ROOT_DIR="$GITHUB_WORKSPACE"
          nix shell nixpkgs#awscli2 --command \
            "$GITHUB_WORKSPACE/scripts/tofu-publish-image.sh"

      - name: Save Nix cache
        if: always()
        uses: https://github.com/nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.cache-nix.outputs.primary-key }}
          gc-max-store-size-linux: 10G
