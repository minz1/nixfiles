on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: nixos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: https://github.com/DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Scan for secrets
        run: |
          nix shell nixpkgs#gitleaks --command \
            gitleaks detect --source . --redact --no-banner
