on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: nixos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: https://github.com/DeterminateSystems/nix-installer-action@v22

      - name: Scan for secrets
        run: |
          nix shell nixpkgs#gitleaks --command \
            gitleaks detect --source . --redact --no-banner
