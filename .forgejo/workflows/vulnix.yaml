# Forgejo only schedules workflows from the default branch.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  vulnix:
    runs-on: nixos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: https://github.com/DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: vulnix scan
        run: |
          nix develop --no-update-lock-file --command just ci vulnix
