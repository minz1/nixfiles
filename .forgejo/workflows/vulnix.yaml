# Forgejo only schedules workflows from the default branch.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  vulnix:
    runs-on: nixos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: https://github.com/DeterminateSystems/nix-installer-action@v22

      - name: vulnix scan
        run: |
          nix develop --no-update-lock-file --command just ci vulnix
