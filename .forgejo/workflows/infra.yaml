on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tofu/infra/**'
      - 'common/topology.nix'

jobs:
  apply:
    runs-on: nixos-latest
    permissions:
      id-token: write
      contents: read
    env:
      INCUS_CONF: /tmp/incus-conf
      INCUS_REMOTE: minz-home-nix-0
    steps:
      - uses: actions/checkout@v6

      - uses: https://github.com/DeterminateSystems/nix-installer-action@v22

      - uses: https://github.com/nix-community/cache-nix-action/restore@v7
        id: cache-nix
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Setup Incus credentials
        run: |
          mkdir -p /tmp/incus-conf
          cp "$GITHUB_WORKSPACE/secrets/incus-client.crt" /tmp/incus-conf/client.crt
          cp /run/secrets/incus_client_key /tmp/incus-conf/client.key
          chmod 600 /tmp/incus-conf/client.key

      - name: Tofu init
        run: |
          set -a; source /run/secrets/tofu-env; set +a
          export TOFU_DIR="$GITHUB_WORKSPACE/tofu/infra"
          nix shell nixpkgs#opentofu --command \
            tofu -chdir="$TOFU_DIR" init -input=false

      - name: Tofu apply
        run: |
          set -a; source /run/secrets/tofu-env; set +a
          export TOFU_DIR="$GITHUB_WORKSPACE/tofu/infra"
          nix shell nixpkgs#opentofu --command \
            tofu -chdir="$TOFU_DIR" apply -auto-approve -input=false

      - name: Save Nix cache
        if: always()
        uses: https://github.com/nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.cache-nix.outputs.primary-key }}
          gc-max-store-size-linux: 10G
