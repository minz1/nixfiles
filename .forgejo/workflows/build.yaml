on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: nixos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: https://github.com/DeterminateSystems/nix-installer-action@v22

      - name: Detect affected hosts
        id: affected
        run: |
          hosts=$(nix develop --command just ci affected-hosts "${{ github.event.before }}" "${{ github.sha }}")
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

      - name: Build and push to Attic
        if: steps.affected.outputs.hosts != ''
        run: |
          nix develop --command just ci attic-push ${{ steps.affected.outputs.hosts }}
