on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: nixos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: https://github.com/DeterminateSystems/nix-installer-action@v22

      - uses: https://github.com/nix-community/cache-nix-action/restore@v7
        id: cache-nix
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Detect affected hosts
        id: affected
        run: |
          hosts=$(nix develop --command just ci affected-hosts "${{ github.event.before }}" "${{ github.sha }}")
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

      - name: Build and push to Attic
        if: steps.affected.outputs.hosts != ''
        run: |
          nix develop --command just ci attic-push ${{ steps.affected.outputs.hosts }}

      # cache-nix-action's save step hardcodes chown -R runner:runner on the Nix DB; this image has no such user.
      - name: Create runner user
        if: always()
        run: |
          sudo groupadd -f runner
          id -u runner &>/dev/null || sudo useradd -M -g runner runner

      - name: Save Nix cache
        if: always()
        uses: https://github.com/nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.cache-nix.outputs.primary-key }}
          gc-max-store-size-linux: 10G
