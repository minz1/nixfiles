on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: nixos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: https://github.com/DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Verify flake.lock is current
        run: |
          nix flake lock --no-update-lock-file
          git diff --exit-code flake.lock

      - name: Detect affected hosts
        id: affected
        run: |
          hosts=$(nix develop --no-update-lock-file --command just ci affected-hosts "${{ github.event.before }}" "${{ github.sha }}")
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.affected.outputs.hosts != ''
        run: |
          nix develop --no-update-lock-file --command just ci build ${{ steps.affected.outputs.hosts }}

      # the token only exists in this step, and only for reviewed code on main
      - name: Push to Attic
        if: steps.affected.outputs.hosts != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ATTIC_PUSH_TOKEN: ${{ secrets.ATTIC_PUSH_TOKEN }}
        run: |
          nix develop --no-update-lock-file --command just ci attic-push
